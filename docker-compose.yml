services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyro
      POSTGRES_PASSWORD: kyro_password
      POSTGRES_DB: kyro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=128MB"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    mem_limit: 96m
    command:
      - "redis-server"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - ""
      - "--appendonly"
      - "no"

  # S3-compatible object storage (replaces MinIO, whose images are no longer
  # published). Pinned: do not use :latest, a surprise upgrade can break storage.
  # Runs as uid 10001; a named volume needs no chown (a host bind mount would).
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-kyro_admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-kyro_password}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
    mem_limit: 256m
    command: /data

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
